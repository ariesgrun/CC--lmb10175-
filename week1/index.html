<!DOCTYPE html>

<html>
  <head>
      <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.js"></script>
      <script src="background.js"></script>
    <style>
    a {
    color: #3498db; 
    text-decoration: none; /* removes the underline */
      } 
    a:hover {
    color: #e74c3c; 
      }
    body{
      margin: 0;
      background: #315329;
      color: #f0f0f0;
      font-family: sans-serif;
      position: relative;
      z-index: 1;

      }


#topMiddle {
  background: #1f3519;
  top: 0;
  left: 0;
  width: 200px;
  text-align: center;
  position: fixed;
  z-index: 1;
  display: flex;
  justify-content: center;
  border-radius: 15px;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 10px;
}

#topLeft{
  background: #1f3519;
  width: 200px;
  position: fixed;
  top: 0;
  left: 10px;
  z-index: 2;
  text-align: center;
  border-radius: 15px;
  margin-top: 10px;
}
#pictures {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;

  background: #1f3519;
  padding: 30px;
  margin: 100px auto 0;
  width: 80%;
  border-radius: 15px;
  flex-wrap: wrap;
}

#pictures img {
  width: 30%;
  height: auto;
  object-fit: contain;
  border-radius: 10px;
}

#pictures p {
  width: 100%;
  margin: 10px 0 0;
  font-size: 17px;
  line-height: 1.5;
  text-align: left;
}

  canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}
    </style>
  </head>



  <body>
    <div id="topLeft">
      <h1> <a href="../index.html"</a>Home</h1>
    </div>

    <div id="topMiddle">
      <h1> <a href="https://annalucia.io/selected.html">Anna Lucia</a></h1>
    </div>


    <div id="pictures"> 
      <img src="./images/AL-img1.png" >
      <img src="./images/AL-img2.png" >
      <img src="./images/AL-img3.png" >
      <p>dsdasdsdasdwsd</p>

    </div>

    
  </body>
</html>
